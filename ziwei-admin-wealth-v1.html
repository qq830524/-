<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>後台工具 · 個性 × 財富版</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ec;--white:#fff;--border:#e2ddd6;--text:#2c2825;--gray:#8c857d;
  --light:#f9f7f4;--gold:#a07830;--gold-l:#c9a55a;--gold-bg:#fdf8f0;--r:6px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);font-size:14px;}

/* TOP */
.top{background:var(--white);border-bottom:1px solid var(--border);padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;}
.top-l{display:flex;align-items:center;gap:8px;}
.top-badge{background:var(--text);color:#fff;font-size:10px;font-weight:600;letter-spacing:1px;padding:3px 8px;border-radius:3px;}
.top-title{font-size:13px;font-weight:600;}
.top-r{display:flex;align-items:center;gap:8px;}
.saved{font-size:11px;color:#2a8a5a;background:#edf7ee;border:1px solid #9ed4a8;border-radius:4px;padding:3px 10px;opacity:0;transition:opacity 0.3s;}
.saved.show{opacity:1;}
.btn{padding:7px 16px;border-radius:var(--r);font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:'Noto Sans TC',sans-serif;transition:all 0.15s;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--gray);}
.btn-outline:hover{border-color:var(--gold);color:var(--gold);}
.btn-gold{background:var(--gold);color:#fff;}
.btn-gold:hover{background:var(--gold-l);}

/* LAYOUT */
.shell{display:grid;grid-template-columns:400px 1fr;min-height:calc(100vh - 52px);}

/* FORM */
.form-col{background:var(--white);border-right:1px solid var(--border);overflow-y:auto;height:calc(100vh - 52px);position:sticky;top:52px;}
.grp{border-bottom:1px solid var(--border);}
.grp-hd{padding:12px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;transition:background 0.1s;}
.grp-hd:hover{background:var(--light);}
.grp-hd-l{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;}
.grp-arrow{font-size:9px;color:var(--gray);transition:transform 0.2s;}
.grp-arrow.o{transform:rotate(90deg);}
.grp-body{padding:12px 20px 18px;display:none;}
.grp-body.o{display:block;}

/* FIELDS */
.f{margin-bottom:11px;}
.f:last-child{margin-bottom:0;}
.f>label{display:block;font-size:11px;font-weight:500;color:var(--gray);margin-bottom:5px;}
.f input,.f textarea,.f select{width:100%;background:#fff;border:1px solid var(--border);border-radius:4px;padding:7px 10px;font-size:13px;font-family:'Noto Sans TC',sans-serif;color:var(--text);outline:none;transition:border 0.12s;line-height:1.6;}
.f input:focus,.f textarea:focus,.f select:focus{border-color:#ababab;}
.f textarea{resize:vertical;min-height:76px;}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.f-hint{font-size:10.5px;color:var(--gray);margin-top:3px;}

/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;}
.chip{padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:500;border:1px solid var(--border);background:#fff;cursor:pointer;transition:all 0.12s;color:var(--gray);user-select:none;}
.chip:hover{border-color:var(--gold);color:var(--gold);}
.chip.on{background:var(--text);border-color:var(--text);color:#fff;}

/* SIHUA */
.sihua-row{display:grid;grid-template-columns:1fr auto;gap:6px;margin-bottom:6px;align-items:center;}
.sihua-star{font-size:12px;font-weight:500;padding:5px 10px;background:var(--light);border-radius:4px;}
.sihua-btns{display:flex;gap:4px;}
.sh-btn{padding:4px 8px;border-radius:4px;font-size:11px;font-weight:600;border:1px solid var(--border);background:#fff;cursor:pointer;transition:all 0.12s;color:var(--gray);user-select:none;}
.sh-btn.lu.on{background:#d4622a;border-color:#d4622a;color:#fff;}
.sh-btn.quan.on{background:#2a6aad;border-color:#2a6aad;color:#fff;}
.sh-btn.ke.on{background:#2a8a5a;border-color:#2a8a5a;color:#fff;}
.sh-btn.ji.on{background:#8a2a3a;border-color:#8a2a3a;color:#fff;}
.fu-sh-row{display:flex;align-items:center;gap:5px;margin-top:4px;}
.fu-sh-star{font-size:11.5px;font-weight:500;padding:3px 8px;background:var(--light);border-radius:4px;min-width:36px;text-align:center;}

/* TYPE */
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:4px;}
.type-btn{padding:8px 6px;border-radius:5px;font-size:11.5px;font-weight:500;border:1.5px solid var(--border);background:#fff;cursor:pointer;transition:all 0.12s;color:var(--gray);user-select:none;text-align:center;}
.type-btn:hover{border-color:var(--gold);color:var(--gold);}
.type-btn.on{background:var(--text);border-color:var(--text);color:#fff;}

/* CENTERS */
.centers-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:4px;}
.center-card{border:1.5px solid var(--border);border-radius:6px;padding:8px 4px 7px;text-align:center;cursor:pointer;transition:all 0.12s;user-select:none;background:#fff;}
.center-card:hover{border-color:#ababab;}
.center-card.on{background:var(--text);border-color:var(--text);}
.center-icon{font-size:15px;line-height:1.3;}
.center-name{font-size:9.5px;font-weight:500;color:var(--gray);margin-top:2px;line-height:1.2;}
.center-card.on .center-name{color:#fff;}
.center-state{font-size:9px;color:#ccc;margin-top:1px;}
.center-card.on .center-state{color:rgba(255,255,255,0.5);}

/* CHANNELS */
.channel-list{display:flex;flex-direction:column;gap:3px;margin-top:6px;}
.ch-btn{width:100%;padding:6px 10px;border-radius:4px;border:1px solid var(--border);background:#fff;font-size:11.5px;color:var(--gray);cursor:pointer;transition:all 0.1s;user-select:none;text-align:left;display:flex;align-items:center;gap:8px;}
.ch-btn:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-bg);}
.ch-btn.on{background:var(--text);border-color:var(--text);color:#fff;}
.ch-num{font-size:10px;font-weight:700;opacity:0.6;min-width:38px;flex-shrink:0;}
.ch-btn.on .ch-num{opacity:0.7;}
.ch-desc{font-size:10px;opacity:0.6;margin-left:2px;}

/* GATES */
.gates-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin-top:6px;}
.gate-btn{width:100%;aspect-ratio:1;border-radius:4px;border:1px solid var(--border);background:#fff;font-size:10px;font-weight:500;color:var(--gray);cursor:pointer;transition:all 0.1s;user-select:none;display:flex;align-items:center;justify-content:center;}
.gate-btn:hover{border-color:var(--gold);color:var(--gold);}
.gate-btn.on{background:var(--text);border-color:var(--text);color:#fff;}

/* UPLOAD */
.upload-box{border:2px dashed var(--border);border-radius:8px;padding:20px 16px;text-align:center;cursor:pointer;transition:all 0.15s;background:var(--light);}
.upload-box:hover{border-color:var(--gold);background:var(--gold-bg);}
.upload-box.has-img{padding:0;border-style:solid;position:relative;}
.upload-box.has-img img{width:100%;display:block;border-radius:6px;}
.upload-icon{font-size:22px;margin-bottom:6px;color:var(--gray);}
.upload-text{font-size:12.5px;font-weight:500;color:var(--gray);}
.upload-hint{font-size:10.5px;color:#bbb;margin-top:3px;}
.upload-clear{position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.55);color:#fff;border:none;border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer;font-family:'Noto Sans TC',sans-serif;}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:999;align-items:center;justify-content:center;}
.modal-bg.show{display:flex;}
.modal{background:#fff;border-radius:10px;padding:24px;width:90%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,0.2);}
.modal h3{font-size:15px;font-weight:600;margin-bottom:6px;}
.modal-note{font-size:12px;color:var(--gray);margin-bottom:12px;line-height:1.7;background:#fdf8f0;border:1px solid #e8d8b0;border-radius:6px;padding:10px 12px;}
.modal textarea{width:100%;height:200px;font-size:11px;font-family:monospace;border:1px solid var(--border);border-radius:6px;padding:10px;resize:none;background:#f9f7f4;color:#333;outline:none;}
.modal-btns{display:flex;gap:8px;margin-top:12px;justify-content:flex-end;}

/* PREVIEW */
.preview-col{overflow-y:auto;height:calc(100vh - 52px);background:#e8e4de;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:16px;}
.preview-label{font-size:11px;color:var(--gray);letter-spacing:0.5px;width:100%;max-width:660px;}
#pframe{width:100%;max-width:660px;border:none;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,0.15);background:#fff;min-height:400px;}
</style>
</head>
<body>

<div class="top">
  <div class="top-l">
    <span class="top-badge">後台工具</span>
    <span class="top-title">個性 × 財富 解析版</span>
  </div>
  <div class="top-r">
    <span class="saved" id="saved">✓ 已儲存</span>
    <button class="btn btn-outline" onclick="clearAll()">清除</button>
    <button class="btn btn-gold" onclick="showModal()">複製 HTML 程式碼</button>
  </div>
</div>

<div class="shell">
<div class="form-col">

  <!-- 基本資料 -->
  <div class="grp">
    <div class="grp-hd" onclick="tog(this)">
      <div class="grp-hd-l">📋 基本資料</div>
      <span class="grp-arrow o">▶</span>
    </div>
    <div class="grp-body o">
      <div class="f"><label>命主姓名</label><input id="f-name" placeholder="王小明" oninput="upd()"></div>
      <div class="f-row">
        <div class="f"><label>出生日期</label><input id="f-birth" placeholder="1990/05/12" oninput="upd()"></div>
        <div class="f"><label>出生時辰</label><input id="f-time" placeholder="子時" oninput="upd()"></div>
      </div>
      <div class="f-row">
        <div class="f"><label>解析師 / 工作室</label><input id="f-analyst" placeholder="星解命理" oninput="upd()"></div>
        <div class="f"><label>解析日期</label><input id="f-date" placeholder="2026/04" oninput="upd()"></div>
      </div>
    </div>
  </div>

  <!-- 紫微 -->
  <div class="grp">
    <div class="grp-hd" onclick="tog(this)">
      <div class="grp-hd-l">☆ 紫微斗數</div>
      <span class="grp-arrow o">▶</span>
    </div>
    <div class="grp-body o">
      <div class="f"><label>命宮主星</label><div class="chips" id="chips-ming"></div></div>
      <div class="f" style="margin-top:8px;"><label>主星四化</label><div id="sihua-area"><div style="font-size:11px;color:#bbb;padding:4px 0;">先選命宮主星</div></div></div>
      <div class="f" style="margin-top:8px;"><label>輔星（文昌文曲可加四化）</label><div class="chips" id="chips-fu"></div><div id="fu-sihua-area" style="margin-top:6px;"></div></div>
      <div class="f" style="margin-top:4px;"><label>凶星</label><div class="chips" id="chips-xiong"></div></div>
    </div>
  </div>

  <!-- 人類圖 -->
  <div class="grp">
    <div class="grp-hd" onclick="tog(this)">
      <div class="grp-hd-l">◎ 人類圖</div>
      <span class="grp-arrow o">▶</span>
    </div>
    <div class="grp-body o">
      <div class="f"><label>類型</label><div class="type-grid" id="type-grid"></div></div>
      <div class="f" style="margin-top:10px;"><label>九大能量中心（黑＝有定義）</label><div class="centers-wrap" id="centers-wrap"></div></div>
      <div class="f" style="margin-top:10px;"><label>有定義通道</label><div class="channel-list" id="ch-list"></div></div>
      <div class="f" style="margin-top:10px;"><label>有定義閘門</label><div class="gates-grid" id="gates-grid"></div></div>
    </div>
  </div>

  <!-- 圖盤 -->
  <div class="grp">
    <div class="grp-hd" onclick="tog(this)">
      <div class="grp-hd-l">🖼 圖盤（直接上傳截圖）</div>
      <span class="grp-arrow">▶</span>
    </div>
    <div class="grp-body">
      <div class="f">
        <label>紫微命盤截圖</label>
        <div class="upload-box" id="ub-zw" onclick="document.getElementById('fi-zw').click()">
          <div class="upload-icon">☆</div>
          <div class="upload-text">點擊上傳紫微命盤圖</div>
          <div class="upload-hint">JPG / PNG</div>
        </div>
        <input type="file" id="fi-zw" accept="image/*" style="display:none" onchange="loadImg('zw',this)">
      </div>
      <div class="f">
        <label>人類圖截圖</label>
        <div class="upload-box" id="ub-hd" onclick="document.getElementById('fi-hd').click()">
          <div class="upload-icon">◎</div>
          <div class="upload-text">點擊上傳人類圖</div>
          <div class="upload-hint">JPG / PNG</div>
        </div>
        <input type="file" id="fi-hd" accept="image/*" style="display:none" onchange="loadImg('hd',this)">
      </div>
    </div>
  </div>

  <!-- 個性解析 -->
  <div class="grp">
    <div class="grp-hd" onclick="tog(this)">
      <div class="grp-hd-l">☆ 個性解析</div>
      <span class="grp-arrow">▶</span>
    </div>
    <div class="grp-body">
      <div class="f"><label>紫微觀點</label><div class="f-with-mic"><textarea id="f-per-z" oninput="upd()" placeholder="命宮主星帶來的個性特質..."></textarea><button class="mic-btn" onclick="startMic('f-per-z', this)" title="語音輸入">🎤</button></div></div>
      <div class="f"><label>人類圖補充</label><div class="f-with-mic"><textarea id="f-per-h" oninput="upd()" placeholder="類型與九大中心如何呈現在個性上..."></textarea><button class="mic-btn" onclick="startMic('f-per-h', this)" title="語音輸入">🎤</button></div></div>
      <div class="f"><label>整合洞見</label><div class="f-with-mic"><textarea id="f-per-i" oninput="upd()" placeholder="兩套系統的共鳴點與建議..."></textarea><button class="mic-btn" onclick="startMic('f-per-i', this)" title="語音輸入">🎤</button></div></div>
    </div>
  </div>

  <!-- 財富解析 -->
  <div class="grp">
    <div class="grp-hd" onclick="tog(this)">
      <div class="grp-hd-l">◈ 財富解析</div>
      <span class="grp-arrow">▶</span>
    </div>
    <div class="grp-body">
      <div class="f"><label>紫微觀點</label><div class="f-with-mic"><textarea id="f-love-z" oninput="upd()" placeholder="財帛宮主星、化祿方向、正財偏財傾向、福德宮..."></textarea><button class="mic-btn" onclick="startMic('f-love-z', this)" title="語音輸入">🎤</button></div></div>
      <div class="f"><label>人類圖補充</label><div class="f-with-mic"><textarea id="f-love-h" oninput="upd()" placeholder="類型對應的財富策略、薦骨中心或意志力中心定義狀態、相關通道..."></textarea><button class="mic-btn" onclick="startMic('f-love-h', this)" title="語音輸入">🎤</button></div></div>
      <div class="f"><label>整合洞見</label><div class="f-with-mic"><textarea id="f-love-i" oninput="upd()" placeholder="最適合的賺錢方式、財富阻塞點與突破建議..."></textarea><button class="mic-btn" onclick="startMic('f-love-i', this)" title="語音輸入">🎤</button></div></div>
    </div>
  </div>

  <!-- 結語 -->
  <div class="grp">
    <div class="grp-hd" onclick="tog(this)">
      <div class="grp-hd-l">✦ 結語</div>
      <span class="grp-arrow">▶</span>
    </div>
    <div class="grp-body">
      <div class="f"><div class="f-with-mic"><textarea id="f-closing" oninput="upd()" placeholder="給命主的一段話..."></textarea><button class="mic-btn" onclick="startMic('f-closing', this)" title="語音輸入">🎤</button></div></div>
    </div>
  </div>

</div><!-- /form -->

<div class="preview-col">
  <div class="preview-label">即時預覽 ↓　填完後點「複製 HTML 程式碼」</div>
  <iframe id="pframe" scrolling="yes"></iframe>
</div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h3>📋 取得命主報告 HTML</h3>
    <div class="modal-note">
      步驟：<strong>點「全選並複製」</strong> → 開啟記事本（或任何文字編輯器）→ 貼上 → 另存新檔<br>
      檔名改成：<strong>命主姓名.html</strong>（例：wang-xiaoming.html）<br>
      然後上傳到 GitHub，命主就能用連結打開 ✦
    </div>
    <textarea id="modal-code" readonly></textarea>
    <div class="modal-btns">
      <button class="btn btn-outline" onclick="closeModal()">關閉</button>
      <button class="btn btn-gold" id="copy-btn" onclick="copyCode()">全選並複製</button>
    </div>
  </div>
</div>

<script>
// ── DATA ──
const STARS = ['紫微','天機','太陽','武曲','天同','廉貞','天府','太陰','貪狼','巨門','天相','天梁','七殺','破軍'];
const FU_STARS = ['左輔','右弼','文昌','文曲','天魁','天鉞','祿存','天馬'];
const FU_SIHUA = ['文昌','文曲'];
const XIONG_STARS = ['擎羊','陀羅','火星','鈴星','天空','地劫','化忌'];
const TYPES = ['生產者','顯示生產者','投射者','顯示者','反映者'];
const CENTERS = [
  {id:'head',   name:'頭腦中心',  icon:'🧠'},

  {id:'throat', name:'喉嚨中心',  icon:'🗣'},
  {id:'g',      name:'G中心',     icon:'♡'},
  {id:'will',   name:'意志力中心',icon:'💪'},

  {id:'spleen', name:'直覺中心',  icon:'🛡'},
  {id:'root',   name:'根部中心',  icon:'🌿'},
];
const CHANNELS = [
  {id:'1-8',   name:'創意通道'}, {id:'2-14',  name:'脈動通道'}, {id:'3-60',  name:'突變通道'},
  {id:'4-63',  name:'邏輯通道'}, {id:'5-15',  name:'節律通道'}, {id:'6-59',  name:'交配通道'},
  {id:'7-31',  name:'領袖通道'}, {id:'9-52',  name:'專注通道'}, {id:'10-20', name:'覺醒通道'},
  {id:'10-34', name:'探索通道'}, {id:'10-57', name:'完美通道'}, {id:'11-56', name:'好奇通道'},
  {id:'12-22', name:'開放通道'}, {id:'13-33', name:'浪子通道'}, {id:'16-48', name:'波長通道'},
  {id:'17-62', name:'接受通道'}, {id:'18-58', name:'判斷通道'}, {id:'19-49', name:'合一通道'},
  {id:'20-34', name:'魅力通道'}, {id:'20-57', name:'當下通道'}, {id:'21-45', name:'錢財通道'},
  {id:'23-43', name:'構建通道'}, {id:'24-61', name:'覺知通道'}, {id:'25-51', name:'啟蒙通道'},
  {id:'26-44', name:'傳遞通道'}, {id:'27-50', name:'保護通道'}, {id:'28-38', name:'鬥士通道'},
  {id:'29-46', name:'發現通道'}, {id:'30-41', name:'幻想通道'}, {id:'32-54', name:'轉化通道'},
  {id:'35-36', name:'遷徙通道'}, {id:'37-40', name:'社群通道'}, {id:'39-55', name:'情緒通道'},
  {id:'42-53', name:'成熟通道'}, {id:'47-64', name:'抽象通道'}, {id:'64-47', name:'混沌通道'},
];

// ── STATE ──
const mingSel = new Set(), fuSel = new Set(), xiongSel = new Set();
const centerDef = new Set(), gatesSel = new Set(), chSel = new Set();
const sihuaMap = {}, fuSihuaMap = {};
let hdType = '', imgZW = '', imgHD = '';
const SKEY = 'ziwei_wealth_v5';

// ── HELPERS ──
const gv = id => (document.getElementById(id)||{value:''}).value.trim();
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// ── BUILD UI ──
function buildChips(cid, arr, sel) {
  document.getElementById(cid).innerHTML = arr.map(s =>
    `<span class="chip${sel.has(s)?' on':''}" data-v="${s}" onclick="toggleChip('${cid}','${s}')">${s}</span>`
  ).join('');
}

function toggleChip(cid, val) {
  const map = {'chips-ming':mingSel,'chips-fu':fuSel,'chips-xiong':xiongSel};
  const sel = map[cid];
  if (sel.has(val)) { sel.delete(val); if(cid==='chips-ming') delete sihuaMap[val]; if(cid==='chips-fu') { delete fuSihuaMap[val]; } }
  else sel.add(val);
  document.querySelector(`#${cid} [data-v="${val}"]`).classList.toggle('on', sel.has(val));
  if (cid==='chips-ming') rebuildSihua();
  if (cid==='chips-fu') rebuildFuSihua();
  upd();
}

function rebuildSihua() {
  const area = document.getElementById('sihua-area');
  const sel = [...mingSel];
  Object.keys(sihuaMap).forEach(s => { if (!sel.includes(s)) delete sihuaMap[s]; });
  if (!sel.length) { area.innerHTML = '<div style="font-size:11px;color:#bbb;padding:4px 0;">先選命宮主星</div>'; return; }
  area.innerHTML = STARS.filter(s => sel.includes(s)).map(s => `
    <div class="sihua-row">
      <span class="sihua-star">${s}</span>
      <div class="sihua-btns">
        ${['lu','quan','ke','ji'].map((t,i) => {
          const labels = ['祿','權','科','忌'];
          return `<button class="sh-btn ${t}${sihuaMap[s]===t?' on':''}" onclick="setSihua('${s}','${t}')">${labels[i]}</button>`;
        }).join('')}
      </div>
    </div>`).join('');
}

function setSihua(star, type) {
  sihuaMap[star] = sihuaMap[star] === type ? null : type;
  rebuildSihua(); upd();
}

function rebuildFuSihua() {
  const area = document.getElementById('fu-sihua-area');
  const capable = [...fuSel].filter(s => FU_SIHUA.includes(s));
  Object.keys(fuSihuaMap).forEach(s => { if (!capable.includes(s)) delete fuSihuaMap[s]; });
  if (!capable.length) { area.innerHTML = ''; return; }
  area.innerHTML = capable.map(s => `
    <div class="fu-sh-row">
      <span class="fu-sh-star">${s}</span>
      <div class="sihua-btns">
        ${['lu','quan','ke','ji'].map((t,i) => {
          const labels = ['祿','權','科','忌'];
          return `<button class="sh-btn ${t}${fuSihuaMap[s]===t?' on':''}" onclick="setFuSihua('${s}','${t}')">${labels[i]}</button>`;
        }).join('')}
      </div>
    </div>`).join('');
}

function setFuSihua(star, type) {
  fuSihuaMap[star] = fuSihuaMap[star] === type ? null : type;
  rebuildFuSihua(); upd();
}

function buildTypes() {
  document.getElementById('type-grid').innerHTML = TYPES.map(t =>
    `<div class="type-btn${hdType===t?' on':''}" data-t="${t}" onclick="setType('${t}')">${t}</div>`
  ).join('');
}

function setType(t) {
  hdType = hdType === t ? '' : t;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('on', b.dataset.t === hdType));
  upd();
}

function buildCenters() {
  document.getElementById('centers-wrap').innerHTML = CENTERS.map(c => `
    <div class="center-card${centerDef.has(c.id)?' on':''}" id="cc-${c.id}" onclick="toggleCenter('${c.id}')">
      <div class="center-icon">${c.icon}</div>
      <div class="center-name">${c.name}</div>
      <div class="center-state">${centerDef.has(c.id)?'有定義':'未定義'}</div>
    </div>`).join('');
}

function toggleCenter(id) {
  if (centerDef.has(id)) centerDef.delete(id); else centerDef.add(id);
  const el = document.getElementById('cc-'+id);
  el.classList.toggle('on', centerDef.has(id));
  el.querySelector('.center-state').textContent = centerDef.has(id)?'有定義':'未定義';
  upd();
}

function buildChannels() {
  document.getElementById('ch-list').innerHTML = CHANNELS.map(c => `
    <button class="ch-btn${chSel.has(c.id)?' on':''}" id="ch-${c.id.replace('-','_')}" onclick="toggleCh('${c.id}')">
      <span class="ch-num">${c.id}</span><span>${c.name}</span>
    </button>`).join('');
}

function toggleCh(id) {
  if (chSel.has(id)) chSel.delete(id); else chSel.add(id);
  document.getElementById('ch-'+id.replace('-','_')).classList.toggle('on', chSel.has(id));
  upd();
}

function buildGates() {
  let h = '';
  for (let i=1; i<=64; i++) h += `<button class="gate-btn${gatesSel.has(i)?' on':''}" id="g${i}" onclick="toggleGate(${i})">${i}</button>`;
  document.getElementById('gates-grid').innerHTML = h;
}

function toggleGate(n) {
  if (gatesSel.has(n)) gatesSel.delete(n); else gatesSel.add(n);
  document.getElementById('g'+n).classList.toggle('on', gatesSel.has(n));
  upd();
}

// ── IMAGE ──
function loadImg(key, input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    if (key==='zw') imgZW = e.target.result; else imgHD = e.target.result;
    const box = document.getElementById('ub-'+key);
    box.className = 'upload-box has-img';
    box.innerHTML = `<img src="${e.target.result}"><button class="upload-clear" onclick="clearImg('${key}',event)">✕ 重新上傳</button>`;
    box.onclick = null;
    upd();
  };
  reader.readAsDataURL(file);
}

function clearImg(key, e) {
  e.stopPropagation();
  if (key==='zw') imgZW=''; else imgHD='';
  const box = document.getElementById('ub-'+key);
  const icon = key==='zw'?'☆':'◎';
  const txt  = key==='zw'?'紫微命盤圖':'人類圖';
  box.className = 'upload-box';
  box.innerHTML = `<div class="upload-icon">${icon}</div><div class="upload-text">點擊上傳${txt}</div><div class="upload-hint">JPG / PNG</div>`;
  box.onclick = () => document.getElementById('fi-'+key).click();
  document.getElementById('fi-'+key).value='';
  upd();
}

// ── ACCORDION ──
function tog(hd) {
  const arrow = hd.querySelector('.grp-arrow');
  const body = hd.nextElementSibling;
  const open = body.classList.contains('o');
  body.classList.toggle('o', !open);
  arrow.classList.toggle('o', !open);
}

// ── SAVE / LOAD ──
function save() {
  try {
    const fields = {};
    document.querySelectorAll('[id^="f-"]').forEach(el => { fields[el.id] = el.value; });
    localStorage.setItem(SKEY, JSON.stringify({
      fields, hdType,
      ming:[...mingSel], fu:[...fuSel], xiong:[...xiongSel],
      centers:[...centerDef], gates:[...gatesSel], ch:[...chSel],
      sihua:{...sihuaMap}, fuSihua:{...fuSihuaMap}
    }));
    const badge = document.getElementById('saved');
    badge.classList.add('show');
    clearTimeout(badge._t);
    badge._t = setTimeout(() => badge.classList.remove('show'), 1800);
  } catch(e){}
}

function load() {
  let s; try { s = JSON.parse(localStorage.getItem(SKEY)); } catch(e){}
  if (!s) return;
  Object.entries(s.fields||{}).forEach(([id,v]) => { const el=document.getElementById(id); if(el) el.value=v; });
  (s.ming||[]).forEach(v => { mingSel.add(v); const el=document.querySelector(`#chips-ming [data-v="${v}"]`); if(el) el.classList.add('on'); });
  (s.fu||[]).forEach(v => { fuSel.add(v); const el=document.querySelector(`#chips-fu [data-v="${v}"]`); if(el) el.classList.add('on'); });
  (s.xiong||[]).forEach(v => { xiongSel.add(v); const el=document.querySelector(`#chips-xiong [data-v="${v}"]`); if(el) el.classList.add('on'); });
  (s.centers||[]).forEach(id => { centerDef.add(id); const el=document.getElementById('cc-'+id); if(el){el.classList.add('on');el.querySelector('.center-state').textContent='有定義';} });
  (s.gates||[]).forEach(n => { gatesSel.add(n); const el=document.getElementById('g'+n); if(el) el.classList.add('on'); });
  (s.ch||[]).forEach(id => { chSel.add(id); const el=document.getElementById('ch-'+id.replace('-','_')); if(el) el.classList.add('on'); });
  Object.assign(sihuaMap, s.sihua||{}); Object.assign(fuSihuaMap, s.fuSihua||{});
  if (s.hdType) { hdType=s.hdType; document.querySelectorAll('.type-btn').forEach(b=>b.classList.toggle('on',b.dataset.t===hdType)); }
  rebuildSihua(); rebuildFuSihua();
}

// ── CLEAR ──
function clearAll() {
  if (!confirm('確定清除所有資料？')) return;
  document.querySelectorAll('[id^="f-"]').forEach(el=>el.value='');
  mingSel.clear(); fuSel.clear(); xiongSel.clear(); centerDef.clear(); gatesSel.clear(); chSel.clear();
  Object.keys(sihuaMap).forEach(k=>delete sihuaMap[k]);
  Object.keys(fuSihuaMap).forEach(k=>delete fuSihuaMap[k]);
  hdType=''; imgZW=''; imgHD='';
  try { localStorage.removeItem(SKEY); } catch(e){}
  document.querySelectorAll('.chip,.type-btn,.gate-btn,.ch-btn').forEach(b=>b.classList.remove('on'));
  buildCenters(); rebuildSihua(); rebuildFuSihua();
  ['zw','hd'].forEach(key => {
    const box=document.getElementById('ub-'+key), icon=key==='zw'?'☆':'◎', txt=key==='zw'?'紫微命盤圖':'人類圖';
    box.className='upload-box';
    box.innerHTML=`<div class="upload-icon">${icon}</div><div class="upload-text">點擊上傳${txt}</div><div class="upload-hint">JPG / PNG</div>`;
    box.onclick=()=>document.getElementById('fi-'+key).click();
    document.getElementById('fi-'+key).value='';
  });
  upd();
}

// ── PREVIEW ──
function upd() {
  save();
  const frame = document.getElementById('pframe');
  const doc = frame.contentDocument || frame.contentWindow.document;
  doc.open(); doc.write(genReport()); doc.close();
  setTimeout(() => { try { frame.style.height = doc.body.scrollHeight + 40 + 'px'; } catch(e){} }, 300);
}

// ── MODAL ──
function showModal() {
  document.getElementById('modal-code').value = genReport();
  document.getElementById('modal-bg').classList.add('show');
  setTimeout(() => document.getElementById('modal-code').select(), 100);
}
function closeModal() { document.getElementById('modal-bg').classList.remove('show'); }
function copyCode() {
  const ta = document.getElementById('modal-code');
  ta.select();
  const btn = document.getElementById('copy-btn');
  navigator.clipboard.writeText(ta.value).then(() => {
    btn.textContent='✓ 已複製！'; btn.style.background='#2a8a5a';
    setTimeout(()=>{btn.textContent='全選並複製';btn.style.background='';},2000);
  }).catch(() => { document.execCommand('copy'); });
}

// ── SPEECH ──
let activeRec = null;
let activeBtn = null;

function startMic(fieldId, btn) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    showMicToast('此瀏覽器不支援語音輸入，請使用 Chrome 或 Safari');
    return;
  }

  // if already recording this field, stop
  if (activeRec && activeBtn === btn) {
    activeRec.stop();
    return;
  }

  // stop any existing recording
  if (activeRec) { try { activeRec.stop(); } catch(e){} }

  const ta = document.getElementById(fieldId);
  const rec = new SpeechRecognition();
  rec.lang = 'zh-TW';
  rec.continuous = true;
  rec.interimResults = true;

  const baseText = ta.value;
  let interim = '';

  rec.onstart = () => {
    activeRec = rec;
    activeBtn = btn;
    btn.classList.add('recording');
    btn.textContent = '⏹';
    btn.title = '點擊停止';
    showMicToast('🎤 錄音中… 說完點 ⏹ 停止');
  };

  rec.onresult = e => {
    let final = '', inter = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript;
      else inter += e.results[i][0].transcript;
    }
    interim += final;
    ta.value = baseText + (baseText && interim ? '\n' : '') + interim + inter;
    upd();
  };

  rec.onerror = e => {
    console.warn('speech error', e.error);
    if (e.error === 'not-allowed') showMicToast('請允許麥克風權限');
    else if (e.error === 'no-speech') showMicToast('沒有偵測到聲音，請再試一次');
    stopMic(btn);
  };

  rec.onend = () => {
    stopMic(btn);
    showMicToast('✓ 錄音完成');
  };

  rec.start();
}

function stopMic(btn) {
  if (btn) {
    btn.classList.remove('recording');
    btn.textContent = '🎤';
    btn.title = '語音輸入';
  }
  activeRec = null;
  activeBtn = null;
}

function showMicToast(msg) {
  let t = document.getElementById('mic-toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2800);
}
